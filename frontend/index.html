<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/output.css">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/font.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@100..700&family=Prompt:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>หน้าหลัก</title>
</head>

<body class="body-login overflow-hidden">
    <div class="mx-auto max-w-lg mt-35">
        <div class="bg-white rounded-xl px-8 py-15">
        <div class="justify-center flex items-center">
            <img src="./image/icon/logo.png" class="w-45 h-38 " alt="">
        </div>
        <div class="mt-3">
            <h1 class="text-center tasa-explorer text-6xl">Login</h1>
            <h1 class="text-center text-xl opacity-60 anuphan-login mt-2">ยินดีต้อนรับสู่ ระบบเช็คชื่อกิจกรรม</h1>
        </div>
        <div class="mt-5">
            <div class="">
                <h1 class="opacity-60 anuphan-login">รหัสประจำตัวนักเรียน</h1>
                <input type="text" class="shadow-lg w-full mt-1 rounded-xl p-1 border border-gray-200 bg-white ps-3" required placeholder="รหัสประจำตัวนักเรียน">
            </div>
            <div class="mt-6">
                <h1 class="opacity-60 anuphan-login">รหัสผ่าน</h1>
                <input type="text" class="shadow-lg w-full mt-1 rounded-xl p-1 border border-gray-200 bg-white ps-3" required placeholder="รหัสผ่าน">
            </div>
            <div class="mt-6">
                <button class="text-center bg-blue-400 p-2 rounded-xl text-white w-full shadow-lg hover:bg-blue-500 hover:translate-x-2 hover:-translate-y-2 transition duration-600" style="font-weight: 600;">Login</button>
            </div>
        </div>
        </div>
    </div>
